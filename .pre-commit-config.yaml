repos:
  - repo: local
    hooks:
      - id: check-gitignore
        name: Ensure .gitignore exists and is not empty
        entry: scripts/check-gitignore.sh
        language: system
        stages: [pre-commit, pre-push]

      - id: block-env-files
        name: Block committing environment files (.env*)
        entry: scripts/block-env.sh
        language: system
        stages: [pre-commit, pre-push]

      - id: check-large-files
        name: Block large tracked files (>5MB)
        entry: scripts/check-large-files.sh
        language: system
        stages: [pre-commit, pre-push]

      # Optional quality checks like ESLint or TypeScript type-checking are
      # intentionally NOT enforced here, to avoid blocking commits on style or
      # non-critical issues. Run them manually with:
      #   npm run lint
      #   npx tsc --noEmit

